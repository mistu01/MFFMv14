name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest tests -v

  shell-checks:
    name: Shell syntax & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POSIX syntax checks
        run: |
          sh -n template/customize.sh
          sh -n template/service.sh
          sh -n template/action.sh
          sh -n template/post-mount.sh
          sh -n template/uninstall.sh
          sh -n template/META-INF/com/google/android/update-binary
          sh -n runtime-template/customize.sh
          sh -n runtime-template/service.sh
          sh -n runtime-template/post-mount.sh
          sh -n runtime-template/uninstall.sh
          sh -n runtime-template/META-INF/com/google/android/update-binary
      # Advisory only for now: the installer targets Android mksh, so findings
      # are reviewed manually rather than gating the build.
      - name: shellcheck (advisory)
        continue-on-error: true
        run: shellcheck -s sh template/customize.sh template/service.sh template/action.sh template/post-mount.sh template/uninstall.sh runtime-template/customize.sh runtime-template/service.sh runtime-template/post-mount.sh runtime-template/uninstall.sh

  package:
    name: Fixture build, template & runtime packaging
    runs-on: ubuntu-latest
    needs: [tests, shell-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Fixture module builds reproducibly under SOURCE_DATE_EPOCH
        run: |
          python tests/make_fixture_fonts.py fixture-fonts
          export SOURCE_DATE_EPOCH=1723680000
          python build.py --fonts-dir fixture-fonts --no-interactive --no-sign \
            --version 1.0 --version-code 1 --output-dir out-a
          python build.py --fonts-dir fixture-fonts --no-interactive --no-sign \
            --version 1.0 --version-code 1 --output-dir out-b
          cmp out-a/*.zip out-b/*.zip
          echo "reproducible fixture build verified"
      - name: Package source template
        run: python build.py --template
      - name: Package runtime module
        run: python build.py --runtime --no-sign
      - name: Upload source template artifact
        uses: actions/upload-artifact@v4
        with:
          name: MFFMv14-Source-Template
          path: dist/MFFMv14-Source-Template.zip
