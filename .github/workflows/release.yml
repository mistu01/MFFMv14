name: Auto Release Template & Runtime

on:
  push:
    branches:
      - main
    paths:
      - 'template/**'
      - 'template-standalone/**'
      - 'runtime-template/**'
      - 'runtime_helper.py'
      - 'build_runtime.py'
      - 'prepare_runtime.py'
      - 'package_template.py'
      - 'build.py'
      - 'build_standalone.py'
      - 'font_module.py'
      - 'font_module_standalone.py'
      - 'termux-build.sh'
      - 'zipsigner_auto.py'
      - 'check_runtime_updates.py'
      - 'CHANGELOG.md'
      - 'CHANGELOG_STANDALONE.md'
      - 'USAGE_GUIDE.md'
      - 'USAGE_GUIDE_STANDALONE.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override release version (leave blank for current date)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Compile & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch All Git Tags
        run: git fetch --tags --force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu llvm
          python -m pip install --upgrade pip
          pip install -r requirements.txt zstandard

      - name: Resolve Release Version & Metadata
        id: release_meta
        run: |
          python - << 'EOF'
          import datetime as dt
          import os
          import re
          import subprocess
          import textwrap
          from pathlib import Path

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8") if changelog_path.exists() else ""

          # Check for manual input override
          override = "${{ inputs.version }}".strip()
          if override:
              version = override.lstrip("v")
              tag = f"v{version}"
          else:
              today = dt.datetime.now(dt.timezone.utc).strftime("%Y.%m.%d")
              cl_match = re.search(r'##\s+([0-9]{4}\.[0-9]{2}\.[0-9]{2})', changelog)
              cl_date = cl_match.group(1) if cl_match else None
              base_version = cl_date if (cl_date and cl_date >= today) else today

              res = subprocess.run(["git", "tag", "-l"], capture_output=True, text=True)
              existing_tags = set(line.strip() for line in res.stdout.splitlines() if line.strip())

              tag_candidate = f"v{base_version}"
              if tag_candidate not in existing_tags:
                  version = base_version
                  tag = tag_candidate
              else:
                  rev = 1
                  while f"v{base_version}.{rev}" in existing_tags:
                      rev += 1
                  version = f"{base_version}.{rev}"
                  tag = f"v{version}"

          # Extract notes from CHANGELOG.md
          notes = None
          m = re.search(rf'##\s+{re.escape(version)}\s*\n(.*?)(?=\n##\s+[0-9]|\Z)', changelog, re.DOTALL)
          if m:
              notes = m.group(1).strip()
          if not notes and "." in version:
              base_date = ".".join(version.split(".")[:3])
              m = re.search(rf'##\s+{re.escape(base_date)}\s*\n(.*?)(?=\n##\s+[0-9]|\Z)', changelog, re.DOTALL)
              if m:
                  notes = m.group(1).strip()
          if not notes:
              m = re.search(r'##\s+([0-9.]+)\s*\n(.*?)(?=\n##\s+[0-9]|\Z)', changelog, re.DOTALL)
              if m:
                  top_ver = m.group(1).strip()
                  notes = f"(Notes from changelog v{top_ver}):\n\n" + m.group(2).strip()
              else:
                  notes = "Automated compilation of MFFMv14 Template and Runtime Module."

          runtime_name = f"mffm-runtime-{version}.zip"

          body = textwrap.dedent(f"""\
          ## 🚀 MFFMv14 Release {tag}

          ### 📦 Release Assets
          - **`MFFMv14-Standalone-Template.zip`**: Complete self-contained standalone build environment (PC & mobile Termux) to create **100% Python-free, instant-flashing** font modules with zero on-device prerequisites.
          - **`MFFMv14-Source-Template.zip`**: Dynamic font module template for on-device creation (via file managers) or PC, utilizing the shared MFFM Runtime.
          - **`{runtime_name}`**: Standalone MFFM Runtime module (portable Python + fontTools). Flash once in Magisk / KernelSU / APatch.
          - **`SHA256SUMS.txt`**: Cryptographic verification checksums for all release packages.

          ---

          ### 📜 Changelog ({tag})
          {notes}

          ---
          *Automated release compiled and published by GitHub Actions.*
          """)

          Path("release_body.md").write_text(body + "\n", encoding="utf-8")

          print(f"Release version : {version}")
          print(f"Release tag     : {tag}")
          print(f"Release title   : MFFMv14 Release {tag}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"tag={tag}\n")
              out.write(f"title=MFFMv14 Release {tag}\n")
          EOF

      - name: Prepare MFFM Runtime Payloads (aarch64 & x64)
        run: |
          python prepare_runtime.py --version ${{ steps.release_meta.outputs.version }}

      - name: Build MFFM Runtime Module ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python build_runtime.py --output-dir dist/ --version ${{ steps.release_meta.outputs.version }}

      - name: Package MFFMv14 Source & Standalone Template ZIPs
        run: |
          python package_template.py --all

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body_path: release_body.md
          files: |
            dist/MFFMv14-Standalone-Template.zip
            dist/MFFMv14-Source-Template.zip
            dist/mffm-runtime-*.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
